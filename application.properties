# ==============================================================
# PLANTILLA DE CONFIGURACIÓN — VitSync API
# ==============================================================
#
# ⚠️ ESTE ARCHIVO ES UNA PLANTILLA DE REFERENCIA.
#    NO debe contener credenciales reales.
#    Está en .gitignore para seguridad.
#
# Para desarrollo local:
#   1. Copia src/main/resources/application-dev.properties.example
#      → src/main/resources/application-dev.properties
#   2. Rellena tus credenciales
#   3. Ejecuta con: -Dspring.profiles.active=dev
#
# Para producción (Render):
#   Configura todas las variables en el panel de Render.
#   Ver environment_architecture.md para más detalles.
# ==============================================================

# ─── BASE DE DATOS ─────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / HIBERNATE ──────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ─── HIKARI POOL (optimizado para Neon serverless) ─────────────
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.idle-timeout=60000

# ─── SERVIDOR ─────────────────────────────────────────────────
server.port=${PORT:8080}
spring.mvc.dispatch-options-request=true

# ─── CORS / JWT / EMAIL / CIFRADO ────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
# JWT RS256: claves RSA base64 DER (privada PKCS#8, pública X.509)
jwt.private-key=${JWT_PRIVATE_KEY}
jwt.public-key=${JWT_PUBLIC_KEY}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}
# Cifrado en reposo AES-256-GCM (32 bytes base64)
vitsync.encryption.key=${ENCRYPTION_KEY}
resend.api.key=${RESEND_API_KEY}
vitsync.email.from=${MAIL_FROM_ADDRESS:VitSync <no-reply@vitsync.es>}
# Subida de ficheros
vitsync.upload.dir=${UPLOAD_DIR:${user.home}/vitsync-uploads}
