# ==============================================================
# PLANTILLA DE CONFIGURACIÓN — VitSync API
# ==============================================================
#
# ⚠️ ESTE ARCHIVO ES UNA PLANTILLA DE REFERENCIA.
#    NO debe contener credenciales reales.
#    Está en .gitignore para seguridad.
#
# Para desarrollo local:
#   1. Copia src/main/resources/application-dev.properties.example
#      → src/main/resources/application-dev.properties
#   2. Rellena tus credenciales
#   3. Ejecuta con: -Dspring.profiles.active=dev
#
# Para producción (Render):
#   Configura todas las variables en el panel de Render.
#   Ver environment_architecture.md para más detalles.
# ==============================================================

# ─── BASE DE DATOS ─────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / HIBERNATE ──────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ─── HIKARI POOL (optimizado para Neon serverless) ─────────────
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.idle-timeout=60000

# ─── SERVIDOR ─────────────────────────────────────────────────
server.port=${PORT:8080}
spring.mvc.dispatch-options-request=true

# ─── CORS / JWT / EMAIL ──────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
resend.api.key=${RESEND_API_KEY}
vitsync.email.from=${MAIL_FROM_ADDRESS:VitSync <no-reply@vitsync.es>}
