# ==========================================
# CONFIGURACIÓN DE BASE DE DATOS NEON
# ==========================================
spring.datasource.url=jdbc:postgresql://ep-proud-meadow-abgbn2nb-pooler.eu-west-2.aws.neon.tech:5432/VitSync?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_4Ouo8sbxFVcX
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# CONFIGURACIÓN DE JPA/HIBERNATE
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# CONFIGURACIÓN DEL SERVIDOR
# ==========================================
server.port=8080

# ==========================================
# CONFIGURACIÓN DE CORS
# ==========================================
spring.web.cors.allowed-origins=http://localhost:4200,http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ==========================================
# CONFIGURACIÓN DE LOGGING
# ==========================================
logging.level.org.springframework=INFO
logging.level.com.ejemplo.vitsync=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==========================================
# CONFIGURACIÓN DE DEVTOOLS
# ==========================================
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ==========================================
# CONFIGURACIÓN DE JACKSON (JSON)
# ==========================================
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.serialization.write-dates-as-timestamps=false