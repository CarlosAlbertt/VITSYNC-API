# Force Rebuild - JDBC URL Fix
# ==========================================
# CONFIGURACION DE BASE DE DATOS NEON
# ==========================================
# Neon DATABASE_URL viene como postgresql:// pero JDBC necesita jdbc:postgresql://
# Por eso añadimos el prefijo jdbc:
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.mvc.dispatch-options-request=true

# ==========================================
# CONFIGURACION CORS
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200,https://vitsync.es,https://www.vitsync.es}

# ==========================================
# CONFIGURACION JWT
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==========================================
# CONFIGURACION SERVIDOR
# ==========================================
server.port=${PORT:8080}

# ==========================================
# CONFIGURACION EMAIL (RESEND API)
# ==========================================
# Railway bloquea SMTP (587, 465), usamos Resend API (HTTP)
resend.api.key=${RESEND_API_KEY}
vitsync.email.from=${MAIL_FROM_ADDRESS:VitSync <no-reply@vitsync.es>}
