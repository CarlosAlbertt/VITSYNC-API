# ==============================================================
# CONFIGURACIÓN PRODUCCIÓN / TESTING (Variables de Entorno)
# ==============================================================
# Este perfil se activa automáticamente en Render/Deploy.
# Todas las credenciales se leen de variables de entorno.
# NUNCA escribir valores sensibles en este archivo (está versionado).
# Validar el entorno antes de arrancar: scripts/setup-env.sh
# ==============================================================

# ─── Base de Datos ─────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────
# IMPORTANTE: Usar 'validate' en producción para evitar alteraciones
# automáticas del esquema. Los cambios de esquema se aplican con los
# scripts SQL de scripts/sql/ (refresh_tokens, audit_logs, etc.).
# En desarrollo, usar 'update' en application-dev.properties.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ─── Hikari Pool (optimizado para Neon serverless) ─────────────
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.idle-timeout=60000

# ─── Servidor ─────────────────────────────────────────────────
server.port=${PORT:8080}
spring.mvc.dispatch-options-request=true
# Nunca incluir stacktrace ni mensaje de excepción en respuestas de error
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

# ─── CORS ─────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ─── JWT (RS256 — firma asimétrica) ───────────────────────────
# Claves RSA en base64 (DER): privada PKCS#8, pública X.509.
# Generación: scripts/setup-env.sh --generate-keys
# El access token expira en 15 min (requisito datos sanitarios);
# el refresh token (7 días) se gestiona en BD y es revocable.
jwt.private-key=${JWT_PRIVATE_KEY}
jwt.public-key=${JWT_PUBLIC_KEY}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ─── Cifrado en reposo (AES-256-GCM, Art. 32 RGPD) ────────────
# Clave de 32 bytes codificada en base64. Generación:
#   openssl rand -base64 32
# ROTACIÓN: cambiar la clave exige re-cifrar los datos existentes.
vitsync.encryption.key=${ENCRYPTION_KEY}

# ─── Email (Resend API) ──────────────────────────────────────
resend.api.key=${RESEND_API_KEY}
vitsync.email.from=${MAIL_FROM_ADDRESS:VitSync <no-reply@vitsync.es>}

# ─── Subida de ficheros ───────────────────────────────────────
# Límite duro a nivel servlet; los límites por tipo (avatar 2MB,
# documento médico 10MB) se validan en FileUploadController.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
# Directorio FUERA del repositorio. En Render el disco es efímero:
# configurar UPLOAD_DIR a un disco persistente o migrar a S3/Cloudinary.
vitsync.upload.dir=${UPLOAD_DIR:${user.home}/vitsync-uploads}

# ─── Actuator (observabilidad) ────────────────────────────────
# Solo health expuesto por HTTP; sin detalles para usuarios anónimos.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
