# ==============================================================
# CONFIGURACIÓN PRODUCCIÓN / TESTING (Variables de Entorno)
# ==============================================================
# Este perfil se activa automáticamente en Render/Deploy.
# Todas las credenciales se leen de variables de entorno.
# ==============================================================

# ─── Base de Datos ─────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────
# IMPORTANTE: Usar 'validate' en producción para evitar alteraciones
# automáticas del esquema. Usar migraciones (Flyway/Liquibase) para
# cambios de esquema controlados.
# En desarrollo, usar 'update' en application-dev.properties.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ─── Hikari Pool (optimizado para Neon serverless) ─────────────
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.idle-timeout=60000

# ─── Servidor ─────────────────────────────────────────────────
server.port=${PORT:8080}
spring.mvc.dispatch-options-request=true

# ─── CORS ─────────────────────────────────────────────────────
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ─── JWT ──────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ─── Email (Resend API) ──────────────────────────────────────
resend.api.key=${RESEND_API_KEY}
vitsync.email.from=${MAIL_FROM_ADDRESS:VitSync <no-reply@vitsync.es>}
