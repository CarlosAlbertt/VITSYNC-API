# Test Configuration (H2 In-Memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database=h2
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Mocked Environment Variables for Tests
app.cors.allowed-origins=*

# JWT RS256 — par de claves RSA de TEST (no usar en producción)
jwt.private-
jwt.public-
jwt.access-expiration=900000
jwt.refresh-expiration=604800000

# Clave AES-256 de TEST (32 bytes base64)
vitsync.encryption.key=EKvIieNGOCESKX7qut8o8zXkxw+3WNFY3VUGdpFI+wc=

resend.api.key=re_test_key_12345
vitsync.email.from=test@vitsync.es

# Directorio de subida para tests (temporal del sistema)
vitsync.upload.dir=${java.io.tmpdir}/vitsync-test-uploads
